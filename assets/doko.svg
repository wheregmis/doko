<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="t">
  <title id="t">doko: a woven bamboo basket carried by a single strap</title>
  <defs>
    <clipPath id="body">
      <path d="M27 46 Q33 84 55 110 L73 110 Q95 84 101 46 Z"/>
    </clipPath>
  </defs>
  <!-- tile: Nepal-flag blue, so the icon reads on light and dark backgrounds -->
  <rect width="128" height="128" rx="28" fill="#0B3D91"/>

  <!-- namlo: the one strap that carries the load -->
  <path d="M32 50 C28 12 100 12 96 50" fill="none" stroke="#FFF4E0" stroke-width="9" stroke-linecap="round"/>
  <path d="M32 50 C28 12 100 12 96 50" fill="none" stroke="#DC143C" stroke-width="5" stroke-linecap="round"/>

  <!-- basket body -->
  <path d="M27 46 Q33 84 55 110 L73 110 Q95 84 101 46 Z" fill="#D9A15B"/>
  <g clip-path="url(#body)" stroke="#9A6430" stroke-width="2" fill="none" stroke-linecap="round">
    <!-- diagonal weave -->
    <path d="M10 40 L60 120 M22 40 L72 120 M34 40 L84 120 M46 40 L96 120 M58 40 L108 120 M70 40 L120 120"/>
    <path d="M118 40 L68 120 M106 40 L56 120 M94 40 L44 120 M82 40 L32 120 M70 40 L20 120 M58 40 L8 120"/>
  </g>
  <g clip-path="url(#body)" stroke="#7A4A22" stroke-width="3.5">
    <!-- horizontal bands -->
    <path d="M20 64 H108 M20 86 H108"/>
  </g>

  <!-- rim -->
  <ellipse cx="64" cy="46" rx="38" ry="7" fill="#7A4A22"/>
  <ellipse cx="64" cy="45" rx="34" ry="4.5" fill="#4A2C14"/>

  <!-- foot -->
  <rect x="53" y="107" width="22" height="8" rx="2.5" fill="#7A4A22"/>
</svg>
