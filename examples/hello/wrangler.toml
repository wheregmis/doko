# Generated by doko from doko.toml. Do not edit.
name = "doko-hello"
main = "build/index.js"
compatibility_date = "2026-11-01"

[build]
command = "cargo install -q worker-build@^0.9 && worker-build --release"

[triggers]
crons = ["*/30 * * * *"]

[vars]
DOKO_ENV = "dev"

[vars.DOKO_CONFIG]
greeting = "hello from doko"

[[kv_namespaces]]
binding = "CACHE"

[[r2_buckets]]
binding = "FILES"
bucket_name = "doko-hello-files"

[[d1_databases]]
binding = "DB"
database_name = "doko-hello"

[env.prod.vars]
DOKO_ENV = "prod"

[env.prod.vars.DOKO_CONFIG]
greeting = "hello from doko (prod)"

[[env.prod.kv_namespaces]]
binding = "CACHE"

[[env.prod.r2_buckets]]
binding = "FILES"
bucket_name = "doko-hello-files"

[[env.prod.d1_databases]]
binding = "DB"
database_name = "doko-hello"
