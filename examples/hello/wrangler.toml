# Generated by doko from doko.toml. Do not edit.
name = "doko-hello"
main = "build/index.js"
compatibility_date = "2026-11-01"

[build]
command = "cargo install -q worker-build@^0.9 && worker-build --release"

[[migrations]]
new_sqlite_classes = ["RateLimiter"]
tag = "v1"

[triggers]
crons = ["*/30 * * * *"]

[vars]
DOKO_ENV = "dev"

[vars.DOKO_CONFIG]
greeting = "hello from doko"

[vars.DOKO_TASKS]
prune = "*/30 * * * *"

[[kv_namespaces]]
binding = "CACHE"

[[r2_buckets]]
binding = "FILES"
bucket_name = "doko-hello-files"

[[d1_databases]]
binding = "DB"
database_name = "doko-hello"

[[queues.producers]]
binding = "JOBS"
queue = "doko-hello-jobs"

[[queues.consumers]]
queue = "doko-hello-jobs"
max_batch_timeout = 1
max_retries = 2
dead_letter_queue = "doko-hello-jobs-dlq"

[[durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiter"

[env.prod.triggers]
crons = ["0 3 * * *"]

[env.prod.vars]
DOKO_ENV = "prod"

[env.prod.vars.DOKO_CONFIG]
greeting = "hello from doko (prod)"

[env.prod.vars.DOKO_TASKS]
prune = "0 3 * * *"

[[env.prod.kv_namespaces]]
binding = "CACHE"

[[env.prod.r2_buckets]]
binding = "FILES"
bucket_name = "doko-hello-files"

[[env.prod.d1_databases]]
binding = "DB"
database_name = "doko-hello"

[[env.prod.queues.producers]]
binding = "JOBS"
queue = "doko-hello-jobs"

[[env.prod.queues.consumers]]
queue = "doko-hello-jobs"
max_batch_timeout = 1
max_retries = 2
dead_letter_queue = "doko-hello-jobs-dlq"

[[env.prod.durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiter"
