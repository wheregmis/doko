# Generated by doko from doko.toml. Do not edit.
name = "doko-hello"
main = "build/index.js"
compatibility_date = "2026-11-01"

[build]
command = "cargo install -q worker-build@^0.9 && worker-build --release"

[[migrations]]
new_sqlite_classes = ["RateLimiter"]
tag = "v1"

[[migrations]]
new_sqlite_classes = ["Room"]
tag = "v2"

[triggers]
crons = ["*/30 * * * *"]

[vars]
DOKO_ENV = "dev"
DOKO_REQUEST_TIMEOUT_SECS = "10"

[vars.DOKO_CONFIG]
contact_to = "owner@example.com"
greeting = "hello from doko"

[vars.DOKO_TASKS]
prune = "*/30 * * * *"

[vars.DOKO_AUTH]
jwt_issuer = "doko-hello"
session_cookie = "hello_session"
session_ttl_secs = 86400

[[kv_namespaces]]
binding = "CACHE"

[[kv_namespaces]]
binding = "SESSIONS"

[[r2_buckets]]
binding = "FILES"
bucket_name = "doko-hello-files"

[[d1_databases]]
binding = "DB"
database_name = "doko-hello"

[[queues.producers]]
binding = "JOBS"
queue = "doko-hello-jobs"

[[queues.consumers]]
queue = "doko-hello-jobs"
max_batch_timeout = 1
max_retries = 2
dead_letter_queue = "doko-hello-jobs-dlq"

[[durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiter"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[send_email]]
name = "EMAIL"

[[hyperdrive]]
binding = "PG"
id = "set-id-in-doko-toml-before-deploying"
localConnectionString = "postgres://doko:doko@127.0.0.1:5433/doko_hello"

[ai]
binding = "AI"

[env.prod.triggers]
crons = ["0 3 * * *"]

[env.prod.vars]
DOKO_ENV = "prod"
DOKO_REQUEST_TIMEOUT_SECS = "10"

[env.prod.vars.DOKO_CONFIG]
contact_to = "owner@example.com"
greeting = "hello from doko (prod)"

[env.prod.vars.DOKO_TASKS]
prune = "0 3 * * *"

[env.prod.vars.DOKO_AUTH]
jwt_issuer = "doko-hello"
session_cookie = "hello_session"
session_ttl_secs = 86400

[[env.prod.kv_namespaces]]
binding = "CACHE"

[[env.prod.kv_namespaces]]
binding = "SESSIONS"

[[env.prod.r2_buckets]]
binding = "FILES"
bucket_name = "doko-hello-files"

[[env.prod.d1_databases]]
binding = "DB"
database_name = "doko-hello"

[[env.prod.queues.producers]]
binding = "JOBS"
queue = "doko-hello-jobs"

[[env.prod.queues.consumers]]
queue = "doko-hello-jobs"
max_batch_timeout = 1
max_retries = 2
dead_letter_queue = "doko-hello-jobs-dlq"

[[env.prod.durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiter"

[[env.prod.durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[env.prod.send_email]]
name = "EMAIL"

[[env.prod.hyperdrive]]
binding = "PG"
id = "set-id-in-doko-toml-before-deploying"
localConnectionString = "postgres://doko:doko@127.0.0.1:5433/doko_hello"

[env.prod.ai]
