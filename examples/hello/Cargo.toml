[package]
name = "hello"
version.workspace = true
edition.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# `pg` adds doko::Pg (Postgres through Hyperdrive); leave it off if you only use D1.
doko = { workspace = true, features = ["pg"] }
# required: worker's #[event] macro expands to ::worker paths
worker.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
doko = { workspace = true, features = ["pg", "test"] }
