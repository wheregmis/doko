[app]
name = "doko-hello"
compatibility_date = "2026-11-01"
# Requests that take longer get a 504. Without it, only the platform's limits apply.
request_timeout_secs = 10
# To rename or delete a Durable Object class (deleting destroys its stored data):
# renamed_classes = [{ from = "Room", to = "ChatRoom" }]
# deleted_classes = ["Room"]

# Read at runtime with ctx.config::<Config>(). [env.<name>.config] is deep-merged over it.
[config]
greeting = "hello from doko"
contact_to = "owner@example.com"

[env.prod.config]
greeting = "hello from doko (prod)"

# Cron tasks: name = schedule. Handlers are registered in Hooks::tasks.
[tasks]
prune = "*/30 * * * *"

[env.prod.tasks]
prune = "0 3 * * *"

# Bindings. Names become constants in src/bindings.rs. Fields match wrangler's.
# IDs are optional locally; set them per env once the resources exist.
[kv.CACHE]

# Session data for doko::auth::Session. For strongly consistent sessions, declare
# [do.SESSIONS] class_name = "SessionStore" instead and export SessionStore in src/lib.rs.
[kv.SESSIONS]

[r2.FILES]
bucket_name = "doko-hello-files"

[d1.DB]
database_name = "doko-hello"

# Optional doko::auth settings; every key has a default. [env.<name>.auth] overrides per key.
[auth]
session_ttl_secs = 86400          # default: 7 days
session_cookie = "hello_session"  # default: doko_session
jwt_issuer = "doko-hello"         # added to the tokens auth::sign issues, required of every token
# jwt_audience = "hello-api"
# jwks_url = "https://issuer.example/.well-known/jwks.json"   # RS256 keys by `kid`, instead of JWT_PUBLIC_KEY

# Postgres through Hyperdrive: ctx.pg(PG), with doko's `pg` feature. `doko dev` and `doko migrate --pg`
# use this local database; each deployed env needs the `id` from `wrangler hyperdrive create`.
# Start one with: docker run -d -p 127.0.0.1:5433:5432 -e POSTGRES_USER=doko -e POSTGRES_PASSWORD=doko \
#   -e POSTGRES_DB=doko_hello postgres:17-alpine
[hyperdrive.PG]
local_connection_string = "postgres://doko:doko@127.0.0.1:5433/doko_hello"

# Workers AI: ctx.ai(). Runs on Cloudflare even under `doko dev`, so it needs `wrangler login`.
[ai]

# A Durable Object class, exported in src/lib.rs with doko::app!(App, objects: [RateLimiter, Room]).
[do.RATE_LIMITER]
class_name = "RateLimiter"

# One object per chat room, holding its WebSockets: src/controllers/rooms.rs.
[do.ROOMS]
class_name = "Room"

# Sends mail: ctx.mail(EMAIL). Under `doko dev` mail is logged instead of sent.
[email.EMAIL]

# A queue this worker sends jobs to and consumes (Hooks::jobs). Fields match wrangler's consumer settings.
# Add `consume = false` when another worker consumes the queue and this one only sends to it.
[queues.JOBS]
queue = "doko-hello-jobs"
max_batch_timeout = 1
max_retries = 2
dead_letter_queue = "doko-hello-jobs-dlq"
