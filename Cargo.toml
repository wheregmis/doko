[workspace]
resolver = "3"
members = ["crates/*", "examples/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
doko = { path = "crates/doko" }
worker = { version = "0.9", features = ["http", "axum", "d1", "queue"] }
axum = { version = "0.8", default-features = false, features = ["json", "query", "macros"] }
tower-service = "0.3"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
serde_json = "1"

[profile.release]
lto = true
strip = true
codegen-units = 1
