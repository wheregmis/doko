[workspace]
resolver = "3"
members = ["crates/*", "examples/*"]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/wheregmis/doko"
readme = "README.md"
keywords = ["cloudflare", "workers", "framework", "axum", "wasm"]
categories = ["web-programming", "wasm"]

[workspace.dependencies]
doko = { path = "crates/doko", package = "doko-rs", version = "0.1.0" }
worker = { version = "0.9", features = ["http", "axum", "d1", "queue"] }
axum = { version = "0.8", default-features = false, features = ["json", "query", "macros"] }
tower-service = "0.3"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
serde_json = "1"
base64 = "0.22"
mail-parser = "1"
tokio-postgres = { version = "0.7", default-features = false, features = ["js"] }
# Already in the tree through axum and worker.
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }

[profile.release]
lto = true
strip = true
codegen-units = 1
